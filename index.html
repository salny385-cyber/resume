<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>钟灏睿 | Haorui Zhong — Resume</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-dark: #162B4E;
    --blue-soft: #EAF2FA;
    --line: #D5E3F5;
    --gray: #595959;
    --muted: #8C9AAF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.9), transparent 38%),
      linear-gradient(135deg, #F7FAFF 0%, #EAF2FA 55%, #DCE9F8 100%);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #1a1a1a;
  }
  .card {
    width: min(680px, 100%);
    background: #fff;
    border: 1px solid #DCE6F5;
    border-radius: 20px;
    box-shadow: 0 24px 70px rgba(31, 56, 100, .14);
    padding: 48px 44px 34px;
    text-align: center;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 18%;
    border: 3px solid #fff;
    box-shadow: 0 0 0 1px #D9E2F3, 0 8px 24px rgba(31, 56, 100, .14);
    margin-bottom: 18px;
  }
  .eyebrow {
    letter-spacing: .28em;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
  }
  h1 {
    margin: 8px 0 0;
    font-size: 34px;
    line-height: 1.2;
    color: var(--navy);
  }
  h1 span {
    display: block;
    margin-top: 6px;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: .04em;
    color: var(--gray);
  }
  .sub {
    margin: 10px 0 26px;
    font-size: 14px;
    color: var(--gray);
  }
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 150px;
    padding: 12px 22px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: background .18s ease, transform .18s ease;
  }
  .btn.primary {
    background: var(--navy);
    color: #fff;
    box-shadow: 0 8px 20px rgba(31, 56, 100, .20);
  }
  .btn.primary:hover { background: var(--navy-dark); transform: translateY(-1px); }
  .btn.secondary {
    background: var(--blue-soft);
    color: var(--navy);
    border: 1px solid var(--line);
  }
  .btn.secondary:hover { background: #DFEBF8; transform: translateY(-1px); }
  .pdfs {
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .pdfs a {
    color: var(--navy);
    text-decoration: none;
    border-bottom: 1px solid #C9D6E8;
  }
  .pdfs a:hover { border-bottom-color: var(--navy); }
  .meta {
    margin: 26px 0 0;
    font-size: 12px;
    color: #9AA7B8;
  }
  @media (max-width: 520px) {
    .card { padding: 36px 22px 28px; }
    h1 { font-size: 28px; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>
<main class="card">
  <img class="avatar" src="photo.jpg" alt="Haorui Zhong">
  <div class="eyebrow">RESUME / CV</div>
  <h1>钟灏睿 <span>Haorui Zhong</span></h1>
  <p class="sub">Intelligent Manufacturing · Robotics · Mechatronics</p>

  <div class="actions">
    <a class="btn primary" href="zh.html">中文简历</a>
    <a class="btn primary" href="en.html">English CV</a>
  </div>

  <div class="pdfs">
    <a href="Zhong-Haorui-Resume-CN.pdf">下载中文 PDF</a>
    <span> · </span>
    <a href="Haorui-Zhong-Resume-EN.pdf">Download English PDF</a>
  </div>

  <p class="meta">Ningbo University · 2025–2029</p>
</main>
</body>
</html>
